name: Generate navigation.json

on:
  push:
    branches: [master]
    paths:
      - "content/**"
      - "scripts/gen_nav.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate navigation.json
        run: python scripts/gen_nav.py

      - name: Commit if changed
        run: |
          if git diff --quiet navigation.json; then
            echo "navigation.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add navigation.json
          git commit -m "chore: regenerate navigation.json"
          git push
